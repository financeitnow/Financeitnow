[build]
  publish = "src"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/index"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/index.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/privacy"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/privacy.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/terms"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/terms.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/inquiry"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/inquiry.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/acquisition"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/acquisition.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/finForm"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/finForm/index.html"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/finForm/*"
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/car/*"
  function = "car-preview"

[[edge_functions]]
  path = "/api/voice-filters"
  function = "voice-filters"

# Fallback: if edge function is not active, redirect /car/:id to the app
[[redirects]]
  from = "/car/:id"
  to   = "/index.html?car=:id"
  status = 200
  force = false
