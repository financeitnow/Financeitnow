[build]
  publish = "src"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = ["/", "/index", "/index/", "/index.html", "/privacy", "/privacy/", "/privacy.html", "/terms", "/terms/", "/terms.html", "/inquiry", "/inquiry/", "/inquiry.html", "/acquisition", "/acquisition/", "/acquisition.html", "/finForm", "/finForm/", "/finForm/index.html", "/finForm/*"]
  function = "dealer-home-preview"

[[edge_functions]]
  path = "/car/*"
  function = "car-preview"

[[edge_functions]]
  path = "/api/voice-filters"
  function = "voice-filters"

# Fallback: if edge function is not active, redirect /car/:id to the app
[[redirects]]
  from = "/car/:id"
  to   = "/index.html?car=:id"
  status = 200
  force = false
